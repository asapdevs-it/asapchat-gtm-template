name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  metadata:
    name: metadata.yaml syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      # Same command as the validation gate in .ai/agentic.config.json.
      - run: python3 -c "import yaml,sys; yaml.safe_load(open('metadata.yaml'))"
